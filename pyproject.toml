[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "equicdft"
version = "0.0.1"
description = "Equivariant learning of classical density functionals"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "ase>=3.22",
    "numpy>=1.20",
    "torch>=1.12",
]

[tool.setuptools.packages.find]
where = ["src"]
